[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "style-bert-vits2"
dynamic = ["version"]
description = "Style-Bert-VITS2: Bert-VITS2 with more controllable voice styles."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0"
keywords = []
authors = [
    { name = "minamik", email = "minamikik@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "cmudict",
    "cn2an",
    "e2k>=0.6",
    "g2p_en",
    "jaconv",
    "jieba",
    "loguru",
    "nltk<=3.8.1",
    "num2words",
    "numba>=0.59",
    "numpy>=1.26,<3",
    "onnxruntime",
    "pydantic>=2.0",
    "pyopenjtalk-plus",
    "pypinyin",
    "pyworld-prebuilt",
    "safetensors",
    "sentencepiece>=0.2",
    "transformers",
]

[project.optional-dependencies]
torch = [
    "accelerate",
    "torch>=2.1",
]

[project.urls]
Documentation = "https://github.com/sync-dev-org/Style-Bert-VITS2#readme"
Issues = "https://github.com/sync-dev-org/Style-Bert-VITS2/issues"
Source = "https://github.com/sync-dev-org/Style-Bert-VITS2"

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# Keep every torch-family package on the same CUDA index: mixing PyPI and
# CUDA-index builds pulls mismatched CUDA runtimes (e.g. a CUDA 13 torchaudio
# next to a cu129 torch) and breaks imports with missing libcudart.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU-backed execution provider or CUDA device",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/style_bert_vits2/_version.py"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "scipy",
    "ruff",
    "build",
]
# training pipeline (repo checkout usage; not part of the distributed package)
train = [
    "librosa>=0.11",
    "pyannote-audio>=4",
    "soundfile>=0.14",
    "tensorboard>=2.21",
    "torchaudio",
]
# WebUI / dataset tooling (repo checkout usage: app.py, server_*.py,
# transcription, preprocessing, ONNX export)
webui = [
    { include-group = "train" },
    "faster-whisper>=1.0",
    "gputil",
    "gradio>=4.32,<6",
    "onnx",
    "onnxconverter-common",
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime-gpu; sys_platform != 'darwin'",
    "onnxsim-prebuilt",
    "psutil",
    "pyloudnorm",
    "umap-learn",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "dict_data/default.csv",
    "docs",
    "src/style_bert_vits2",
    "tests",
    "LGPL_LICENSE",
    "LICENSE",
    "pyproject.toml",
    "README.md",
]
exclude = [".git", ".gitignore", ".gitattributes"]

[tool.hatch.build.targets.wheel]
packages = ["src/style_bert_vits2"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
